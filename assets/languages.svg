    <text x="38.5" y="79.5" class="name" fill="#CBE0F0">qml</text>
    <text x="38.5" y="97.5" class="pct" fill="#CBE0F0" opacity="0.75">48.8%</text>
  </g>

  <!-- Nix 14.4% -->
