    <text x="486.4" y="197.5" class="name" fill="#01121F">nix</text>
    <text x="486.4" y="215.5" class="pct" fill="#01121F" opacity="0.75">11.7%</text>
  </g>

  <!-- Shell 7.6% -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.32s" fill="freeze"/>
