    <text x="287.4" y="79.5" class="name" fill="#CBE0F0">python</text>
    <text x="287.4" y="97.5" class="pct" fill="#CBE0F0" opacity="0.75">25.8%</text>
  </g>

  <!-- JavaScript 11.7% -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.16s" fill="freeze"/>
