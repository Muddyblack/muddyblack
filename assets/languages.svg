    <text x="486.4" y="79.5" class="name" fill="#CBE0F0">javascript</text>
    <text x="486.4" y="97.5" class="pct" fill="#CBE0F0" opacity="0.75">11.7%</text>
  </g>

  <!-- Nix 11.7% -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.24s" fill="freeze"/>
