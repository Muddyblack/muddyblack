  </g>

  <!-- TypeScript 5.0% -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.4s" fill="freeze"/>
    <rect x="673.5" y="168.6" width="72.2" height="117.9" rx="6" fill="#BFF2FB"/>
    <text x="713.1" y="278.5" class="mini" fill="#01121F" transform="rotate(-90 713.1 278.5)">typescript 5%</text>
  </g>

  <!-- other 3.2% -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.48s" fill="freeze"/>
    <rect x="748.7" y="168.6" width="45.8" height="117.9" rx="6" fill="#254D6A"/>
