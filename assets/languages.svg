<svg xmlns="http://www.w3.org/2000/svg" width="820" height="322" viewBox="0 0 820 322"
     role="img" aria-label="Languages by commit weight: QML 35% · Python 24% · Nix 13% · JavaScript 11% · Shell 8% · TypeScript 5% · other 3%">
  <defs>
    <style>
      .head { font: 600 11px 'JetBrains Mono', ui-monospace, monospace; fill: #0EADCF; letter-spacing: 2px; }
      .foot { font: 500 11px 'JetBrains Mono', ui-monospace, monospace; fill: #8295A0; }
      .name { font: 700 14px 'JetBrains Mono', ui-monospace, monospace; }
      .pct  { font: 500 12px 'JetBrains Mono', ui-monospace, monospace; }
      .mini { font: 600 10px 'JetBrains Mono', ui-monospace, monospace; }
    </style>
  </defs>

  <rect width="820" height="322" fill="#03233A" rx="10" stroke="#254D6A" stroke-width="1"/>
  <text x="24" y="30" class="head">LANGUAGES&#160;BY&#160;COMMIT&#160;WEIGHT</text>
  <text x="796" y="30" class="foot" text-anchor="end">671 commits · 15 repos · last 365 days</text>

  <!-- QML 35.0% -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.0s" fill="freeze"/>
    <rect x="25.5" y="53.5" width="267.1" height="233.0" rx="6" fill="#0B5A70"/>
    <text x="38.5" y="79.5" class="name" fill="#CBE0F0">qml</text>
    <text x="38.5" y="97.5" class="pct" fill="#CBE0F0" opacity="0.75">35.0%</text>
  </g>

  <!-- Python 24.4% -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.08s" fill="freeze"/>
    <rect x="295.6" y="53.5" width="185.1" height="233.0" rx="6" fill="#0E7D99"/>
    <text x="308.6" y="79.5" class="name" fill="#CBE0F0">python</text>
    <text x="308.6" y="97.5" class="pct" fill="#CBE0F0" opacity="0.75">24.4%</text>
  </g>

  <!-- Nix 13.3% -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.16s" fill="freeze"/>
    <rect x="483.7" y="53.5" width="186.8" height="125.0" rx="6" fill="#0EADCF"/>
    <text x="496.7" y="79.5" class="name" fill="#CBE0F0">nix</text>
    <text x="496.7" y="97.5" class="pct" fill="#CBE0F0" opacity="0.75">13.3%</text>
  </g>

  <!-- JavaScript 11.3% -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.24s" fill="freeze"/>
    <rect x="483.7" y="181.5" width="186.8" height="105.0" rx="6" fill="#3FCDE8"/>
    <text x="496.7" y="207.5" class="name" fill="#01121F">javascript</text>
    <text x="496.7" y="225.5" class="pct" fill="#01121F" opacity="0.75">11.3%</text>
  </g>

  <!-- Shell 7.8% -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.32s" fill="freeze"/>
    <rect x="673.5" y="53.5" width="121.0" height="112.1" rx="6" fill="#7FE3F5"/>
    <text x="686.5" y="79.5" class="name" fill="#01121F">shell</text>
